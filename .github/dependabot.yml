# Dependabot configuration for automatic dependency updates
version: 2
updates:
  # Enable version updates for npm dependencies in yukina-blog
  - package-ecosystem: npm
    directory: "/yukina-blog"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "SebPikPik"
    assignees:
      - "SebPikPik"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    # Group updates for better management
    groups:
      astro-updates:
        patterns:
          - "@astrojs/*"
          - "astro"
      react-updates:
        patterns:
          - "react*"
          - "@types/react*"
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "@types/*"
          - "*eslint*"
          - "prettier*"
          - "@iconify*"
      patch-updates:
        update-types:
          - "patch"

  # Enable version updates for GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "SebPikPik"
    assignees:
      - "SebPikPik"
    commit-message:
      prefix: "ci"
      include: "scope"
