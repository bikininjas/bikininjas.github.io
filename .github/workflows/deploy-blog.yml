name: Deploy Next.js Blog to GitHub Pages

on:
  push:
    branches: [ "master", "main" ]
  # Allow manual triggering
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './nextjs-blog/package-lock.json'
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          # Automatically detect static output directory for Next.js
          static_site_generator: next
      
      - name: Install dependencies
        run: cd nextjs-blog && bun install --frozen-lockfile
      
      - name: Run tests
        run: cd nextjs-blog && bun run test:unit
      
      - name: Build with Next.js (includes export)
        run: cd nextjs-blog && bun run build
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./nextjs-blog/out

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
