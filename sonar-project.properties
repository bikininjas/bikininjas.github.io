# Configuration SonarCloud pour bikininjas.github.io
sonar.organization=bikininjas
sonar.projectKey=bikininjas_bikininjas.github.io
sonar.projectName=bikininjas.github.io
sonar.projectVersion=1.0

# Branches
sonar.branch.name=master

# Chemins des sources et exclusions
sonar.sources=nextjs-blog
sonar.exclusions=**/node_modules/**,**/tests/**,**/cypress/**,**/playwright/**,**/coverage/**,**/.next/**,**/out/**,**/public/**,**/*.test.js,**/*.spec.js,**/*.cy.js

# Tests
sonar.tests=nextjs-blog/tests,nextjs-blog/cypress,nextjs-blog/playwright
sonar.test.inclusions=**/*.test.js,**/*.spec.js,**/*.cy.js,**/*.test.jsx,**/*.spec.jsx,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx

# Couverture de code
sonar.javascript.lcov.reportPaths=nextjs-blog/coverage/lcov.info
sonar.javascript.coveragePlugin=lcov
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/*.cy.js,**/tests/**,**/cypress/**,**/playwright/**,**/playwright-report/**

# Quality Gate
sonar.qualitygate.wait=true

# Encodage du code source
sonar.sourceEncoding=UTF-8

# Paramètres additionnels
sonar.verbose=false

# Analyse des duplications
sonar.cpd.exclusions=**/tests/**,**/cypress/**,**/playwright/**

# Analyse TypeScript
sonar.typescript.tsconfigPath=nextjs-blog/tsconfig.json