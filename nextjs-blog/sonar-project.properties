sonar.projectKey=bikininjas_bikininjas.github.io
sonar.organization=bikininjas

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=bikininjas.github.io
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/tests/**,**/cypress/**,**/playwright/**,**/coverage/**,**/.next/**,**/out/**,**/public/**,**/playwright-report/**

# Tests
sonar.tests=tests,cypress,playwright
sonar.test.inclusions=**/*.test.js,**/*.spec.js,**/*.cy.js

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.coveragePlugin=lcov

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Additional parameters
sonar.verbose=true
