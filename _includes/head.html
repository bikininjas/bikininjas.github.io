<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}
  <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
  <!--[if lt IE 9]>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
  <![endif]-->
  <link rel="stylesheet" href="{{ "/assets/css/syntax.css" | relative_url }}">
  {% include head-custom.html %}
  <script defer src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>

  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | absolute_url }}">

  <link rel="shortcut icon" type="image/png" href="{{ "/assets/images/favicon.png" | absolute_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/images/apple-touch-icon.png" | absolute_url }}">
  <!-- For iPad Pro -->
  <link rel="apple-touch-icon" sizes="167x167" href="{{ "/assets/images/apple-touch-icon-167x167.png" | absolute_url }}">
  <!-- For iPhone Retina -->
  <link rel="apple-touch-icon" sizes="152x152" href="{{ "/assets/images/apple-touch-icon-152x152.png" | absolute_url }}">
  <link rel="apple-touch-icon" sizes="144x144" href="{{ "/assets/images/apple-touch-icon-144x144.png" | absolute_url }}">
</head>
